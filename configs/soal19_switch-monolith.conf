# Dokumentasi konfigurasi aktual GNS3 K-09 (bukan file import GNS3)
# Switch-Monolith, access VLAN isolation
# Port 0: Shigeru, VLAN 1
# Port 1: Zeruel, VLAN 1
# Port 2: Armisael eth0, VLAN 99
# Port lainnya: tidak diubah
# EtherType yang ditampilkan: 0x8100
# Pemulihan melalui GUI: Configure > pilih port 2 > VLAN 99 > access > Add > Apply > OK.
# Jika perubahan belum berlaku pada link aktif, sambungkan ulang hanya link Armisael eth0 ke Ethernet2.
# Simpan project. Jangan mengubah konfigurasi IP/firewall Armisael.
# VLAN 99 tidak memiliki gateway atau anggota lain pada topologi ini.
# Rollback: kembalikan port 2 ke VLAN 1; apply dan sambungkan ulang link bila diperlukan.
port=0 vlan=1 type=access peer=Shigeru
port=1 vlan=1 type=access peer=Zeruel
port=2 vlan=99 type=access peer=Armisael_eth0
